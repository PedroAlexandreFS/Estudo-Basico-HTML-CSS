<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FONTES</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            /*MEDIDAS ABSOLUTAS
            CM, MM, IN, PX, PT, PC

            MEDIDAS RELATIVAS
            EM, EX, REM, VW, VH

            É RECOMENDADO USAR SÓ "PX" E "EM" NAS FONTS
            16PX = 1EM

            */
            font-size: 1em;
            font-weight: normal;
            font-style: normal;
            text-decoration: underline;
            /*shorthand font
            -> font-style -> font-weight -> font-size -> font-family
            */

        }

        h1 {

            font: italic bolder 3rem 'Times New Roman', Times, serif;
        }
    </style>
</head>

<body>
    <h1>Trabalho com fontes</h1>
    <P>Lorem ipsum dolor sit amet consectetur adipisicing elit. Eligendi corporis natus cupiditate voluptates ab, in
        doloremque eum dolore nam, adipisci cum hic, quasi odio delectus beatae ullam! Temporibus, fugit dolor.</P>
</body>

</html>
