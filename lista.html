<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista ordenadas</title>
</head>
<body>
    <h1>lista ordenadas e não odenadas</h1>
    <h2>lista ordenada</h2>
    <ol type="A"> <!-- 1 A a I i -->
        <li>Arroz</li>
        <li>Feijão</li>
        <li>Frango</li>
        <li>Alface</li>
        <li>Cebola</li>
    </ol>
    <h2>lista não ordenada</h2>
    <ul type="square"> <!-- disc circle square-->
        <li>caneta</li>
        <li>caderno</li>
        <li>livro</li>
        <li>lapis</li>
        <li>borracha</li>
    </ul>
    
</body>
</html>
